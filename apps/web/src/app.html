<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>wiki-agents</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Set the theme before the first paint. The app's CSS and JS load after this, so
      without it a dark-mode reload flashes white. Keep the storage key and logic in
      sync with src/lib/ui/theme.svelte.ts, and the colours with --bg in tokens.css.
    -->
    <style>
      html { background: #f5f6f8; color-scheme: light; }
      html[data-theme="dark"] { background: #0d0e11; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("wiki-agents:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
