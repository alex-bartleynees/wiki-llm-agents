<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>wiki-agents</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f6e6a" />
    <meta name="apple-mobile-web-app-title" content="wiki-agents" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      html { background: #f5f6f8; color-scheme: light; }
      html[data-theme="dark"] { background: #0d0e11; color-scheme: dark; }
      html[data-theme="gruvbox-dark-hard"] { background: #1d2021; color-scheme: dark; }
      html[data-theme="tokyo-night"] { background: #1f2335; color-scheme: dark; }
      html[data-theme="everforest"] { background: #232a2e; color-scheme: dark; }
      html[data-theme="catppuccin-mocha"] { background: #181825; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var themes = ["light", "dark", "gruvbox-dark-hard", "tokyo-night", "everforest", "catppuccin-mocha"];
        var fontTokens = ["--font-ui", "--font-mono", "--font-read"];
        var root = document.documentElement;
        var theme;
        var fonts;
        try {
          theme = localStorage.getItem("wiki-agents:theme");
          fonts = JSON.parse(localStorage.getItem("wiki-agents:fonts") || "{}").stacks;
        } catch (e) {}
        if (themes.indexOf(theme) === -1) {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.dataset.theme = theme;
        for (var i = 0; fonts && i < fontTokens.length; i++) {
          if (typeof fonts[fontTokens[i]] === "string") root.style.setProperty(fontTokens[i], fonts[fontTokens[i]]);
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
